name: Wallet API - CI
on:
  push:
    branches: [main, 'feature/**', 'hotfix/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Lint
        run: python -m ruff check src tests scripts performance 2>&1 | tee lint.log
      - name: Tests and coverage
        if: success() || failure()
        run: python -m pytest --cov=src --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=junit.xml 2>&1 | tee tests.log
      - name: Coverage gates (lines >= 85%, branches >= 80%)
        if: success() || failure()
        run: python scripts/check_coverage.py coverage.xml 2>&1 | tee coverage-gate.log
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wallet-ci-reports
          path: |
            coverage.xml
            junit.xml
            lint.log
            tests.log
            coverage-gate.log
          if-no-files-found: warn
